<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mes Pronos PMU</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, system-ui, sans-serif; background:#0f172a; color:#e2e8f0; padding:16px; }
  h1 { color:#38bdf8; text-align:center; font-size:1.3rem; margin-bottom:4px; }
  .sub { text-align:center; font-size:.75rem; color:#94a3b8; margin-bottom:14px; }
  .controls { display:flex; flex-direction:column; gap:8px; margin-bottom:14px; }
  select, button { width:100%; padding:13px; border-radius:10px; border:1px solid #334155; background:#1e293b; color:#e2e8f0; font-size:.95rem; }
  button { background:#0284c7; border-color:#0284c7; font-weight:600; }
  button:disabled { opacity:.5; }
  button.refresh { background:#0ea5e9; }
  #status { text-align:center; margin:10px 0; color:#94a3b8; font-size:.85rem; }
  .info { background:#1e293b; padding:12px; border-radius:10px; border-left:4px solid #38bdf8; margin-bottom:10px; }
  .info h2 { color:#38bdf8; font-size:1rem; margin-bottom:4px; }
  .info p { font-size:.8rem; color:#cbd5e1; }
  .section-title { font-size:.85rem; color:#94a3b8; margin:14px 0 8px; text-transform:uppercase; letter-spacing:1px; }
  .card { background:#1e293b; padding:10px; border-radius:10px; margin-bottom:6px; display:flex; align-items:center; gap:10px; border-left:3px solid #475569; }
  .card.top1 { border-left-color:#facc15; }
  .card.top2 { border-left-color:#cbd5e1; }
  .card.top3 { border-left-color:#d97706; }
  .rank { font-size:1.1rem; font-weight:700; color:#38bdf8; min-width:26px; text-align:center; }
  .info-h { flex:1; min-width:0; }
  .name { font-weight:600; font-size:.9rem; }
  .meta { font-size:.72rem; color:#94a3b8; margin-top:1px; }
  .cote { font-weight:700; color:#22c55e; font-size:.95rem; text-align:right; }
  .score { font-size:.7rem; color:#facc15; }
  .arrivee { background:#1e293b; padding:10px; border-radius:10px; margin-bottom:6px; font-size:.85rem; }
  .arrivee strong { color:#facc15; }
  .error { color:#f87171; text-align:center; padding:16px; font-size:.85rem; }
  .footer { text-align:center; margin-top:18px; font-size:.7rem; color:#64748b; line-height:1.5; }
</style>
</head>
<body>

<h1>🐎 Mes Pronos PMU</h1>
<p class="sub">Partants • Cotes • Pronostics • Arrivées</p>

<div class="controls">
  <select id="reunion"><option value="">— Réunion —</option></select>
  <select id="course" disabled><option value="">— Course —</option></select>
  <button id="load" disabled>Charger</button>
  <button id="refresh" class="refresh" disabled style="display:none">🔄 Rafraîchir les cotes</button>
</div>

<div id="status">Chargement…</div>
<div id="result"></div>

<div class="footer">
  Partants/cotes : API PMU • Arrivées : open-pmu-api<br>
  Pronostics calculés (cotes + musique). Jouer comporte des risques.
</div>

<script>
const PROXY = "https://corsproxy.io/?";
const API_PMU = "https://offline.turfinfo.api.pmu.fr/rest/client/1/programme";
const API_ARR = "https://open-pmu-api.vercel.app/api/arrivees";
const today = new Date().toISOString().slice(0,10).replace(/-/g,"");
let programme = null;
const $ = id => document.getElementById(id);

async function pmuGet(path) {
  const res = await fetch(PROXY + encodeURIComponent(`${API_PMU}/${path}`));
  if (!res.ok) throw new Error("PMU HTTP " + res.status);
  return res.json();
}

async function init() {
  try {
    programme = await pmuGet(today);
    (programme.reunions || []).forEach(ru => {
      const o = document.createElement("option");
      o.value = ru.numOfficiel;
      o.textContent = `R${ru.numOfficiel} — ${ru.hippodrome?.libelleLong || ""}`;
      $("reunion").appendChild(o);
    });
    $("status").textContent = "Sélectionnez une réunion.";
  } catch(e) {
    $("status").innerHTML = `<span class="error">Erreur programme : ${e.message}<br>Réessayez dans quelques secondes.</span>`;
  }
}

$("reunion").onchange = () => {
  const ru = programme.reunions.find(x => String(x.numOfficiel) === $("reunion").value);
  $("course").innerHTML = '<option value="">— Course —</option>';
  $("course").disabled = !ru;
  $("load").disabled = true;
  $("refresh").style.display = "none";
  $("result").innerHTML = "";
  if (!ru) return;
  (ru.courses || []).forEach(c => {
    const o = document.createElement("option");
    o.value = c.numOrdre;
    o.textContent = `C${c.numOrdre} — ${c.libelle || ""} (${c.discipline || ""} ${c.distance || ""}m)`;
    $("course").appendChild(o);
  });
  $("status").textContent = "Sélectionnez une course.";
};

$("course").onchange = () => {
  const ok = !!$("course").value;
  $("load").disabled = !ok;
  if (ok) $("refresh").style.display = "block";
};

$("load").onclick = load;
$("refresh").onclick = load;

function scoreProno(p) {
  // Score simple : cote basse = favori, musique = forme
  let score = 0;
  const cote = p.cote < 999 ? p.cote : 50;
  score += Math.max(0, 100 - cote * 2); // plus la cote est basse, plus le score est haut
  // Musique : "1p 2p 3p" → bonus pour places récentes
  const mus = (p.musique || "").split(/\s+/).slice(0,5);
  mus.forEach((m, i) => {
    const place = parseInt(m);
    if (!isNaN(place)) {
      if (place === 1) score += 15 - i*2;
      else if (place <= 3) score += 8 - i;
      else if (place <= 5) score += 3 - i*0.5;
    }
  });
  return Math.max(0, Math.round(score));
}

async function load() {
  const ru = $("reunion").value, co = $("course").value;
  $("status").textContent = "Chargement…";
  $("result").innerHTML = "";
  $("load").disabled = true;

  try {
    // 1) Partants + cotes
    const data = await pmuGet(`${today}/R${ru}/C${co}/participants`);
    const parts = (data.participants || []).map(p => ({
      ...p,
      cote: parseFloat(p.dernierRapportDirect?.rapport) || parseFloat(p.dernierRapportReference?.rapport) || 999
    }));

    const ruData = programme.reunions.find(x => String(x.numOfficiel) === ru);
    const coData = ruData.courses.find(c => String(c.numOrdre) === co);

    // Header course
    const info = document.createElement("div");
    info.className = "info";
    info.innerHTML = `<h2>R${ru} C${co} — ${coData.libelle || ""}</h2>
      <p>${coData.discipline || ""} • ${coData.distance || "?"}m • ${parts.length} partants</p>`;
    $("result").appendChild(info);

    // 2) Classement pronostic
    parts.forEach(p => p.score = scoreProno(p));
    const sorted = [...parts].sort((a,b) => b.score - a.score);

    const titleP = document.createElement("div");
    titleP.className = "section-title";
    titleP.textContent = "🎯 Pronostic (score)";
    $("result").appendChild(titleP);

    sorted.forEach((p, i) => {
      const card = document.createElement("div");
      card.className = "card" + (i===0?" top1":i===1?" top2":i===2?" top3":"");
      card.innerHTML = `
        <div class="rank">${i+1}</div>
        <div class="info-h">
          <div class="name">${p.numPmu || ""} — ${p.nom || ""}</div>
          <div class="meta">${p.driver || ""} • Musique: ${p.musique || "—"}</div>
        </div>
        <div style="text-align:right">
          <div class="cote">${p.cote < 999 ? p.cote.toFixed(1) : "—"}</div>
          <div class="score">score ${p.score}</div>
        </div>`;
      $("result").appendChild(card);
    });

    // 3) Arrivées passées (même prix si possible)
    try {
      const arrRes = await fetch(`${API_ARR}?prix=${encodeURIComponent(coData.libelle || "")}`);
      const arrData = await arrRes.json();
      const courses = (arrData.message || []).slice(0, 3);
      if (courses.length) {
        const titleA = document.createElement("div");
        titleA.className = "section-title";
        titleA.textContent = "📊 Arrivées passées (même prix)";
        $("result").appendChild(titleA);
        courses.forEach(c => {
          const div = document.createElement("div");
          div.className = "arrivee";
          div.innerHTML = `<strong>${c.date}</strong> — ${c.lieu} • ${c.discipline} ${c.distance}m<br>
            Arrivée : <strong>${(c.arrivee||[]).join(" - ")}</strong>`;
          $("result").appendChild(div);
        });
      }
    } catch(e) { /* silencieux : arrivées optionnelles */ }

    $("status").textContent = `✅ Mis à jour à ${new Date().toLocaleTimeString()}`;
    $("load").disabled = false;
  } catch(e) {
    $("status").innerHTML = `<span class="error">Erreur : ${e.message}</span>`;
    $("load").disabled = false;
  }
}

init();
</script>
</body>
</html>
