<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mes Pronos PMU</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, system-ui, sans-serif; background:#0f172a; color:#e2e8f0; height: 100vh; display: flex; flex-direction: column; }
  header { padding: 16px; text-align: center; border-bottom: 1px solid #334155; background: #1e293b; z-index: 10; }
  h1 { color:#38bdf8; font-size:1.2rem; }
  .sub { font-size:.75rem; color:#94a3b8; margin-top: 4px; }
  .controls { padding: 12px; display: flex; gap: 8px; background: #0f172a; z-index: 10; }
  button { flex: 1; padding: 12px; border-radius: 8px; border: none; background: #0284c7; color: white; font-size: 0.9rem; font-weight: 600; }
  button:active { background: #0369a1; }
  .frame-container { flex: 1; width: 100%; position: relative; background: white; }
  iframe { width: 100%; height: 100%; border: none; display: block; }
  .error-message { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; color: #64748b; font-size: 0.9rem; padding: 20px; }
</style>
</head>
<body>

<header>
  <h1>🐎 Mes Pronos PMU</h1>
  <p class="sub">Les vraies données officielles en direct</p>
</header>

<div class="controls">
  <button onclick="loadPmu('programme')">📅 Programme</button>
  <button onclick="loadPmu('pronostics')">🎯 Pronostics</button>
</div>

<div class="frame-container" id="frameContainer">
  <div class="error-message">Cliquez sur un bouton pour afficher les données du PMU.</div>
</div>

<script>
// Fonction pour charger le site du PMU directement dans l'application
function loadPmu(page) {
  const container = document.getElementById("frameContainer");
  
  // On affiche un message de chargement
  container.innerHTML = '<div class="error-message">Chargement des données officielles...</div>';
  
  // On crée l'iframe vers le site du PMU
  const iframe = document.createElement("iframe");
  
  if (page === 'programme') {
    // Lien vers le programme des courses du jour
    iframe.src = "https://www.pmu.fr/turf/programme";
  } else {
    // Lien vers les pronostics du jour
    iframe.src = "https://www.pmu.fr/turf/pronostics";
  }
  
  // Quand l'iframe charge, on l'ajoute au conteneur
  iframe.onload = function() {
    container.innerHTML = "";
    container.appendChild(iframe);
  };
  
  // Si le site refuse de s'afficher (sécurité), on affiche un bouton de secours
  iframe.onerror = function() {
    container.innerHTML = `
      <div class="error-message">
        Le PMU bloque l'affichage intégré.<br><br>
        <a href="${iframe.src}" style="color:#38bdf8;text-decoration:underline;">Ouvrir directement dans Safari</a>
      </div>
    `;
  };
  
  // On tente le chargement
  setTimeout(() => {
    if (!container.querySelector('iframe')) {
      container.innerHTML = "";
      container.appendChild(iframe);
    }
  }, 100);
}
</script>
</body>
</html>
