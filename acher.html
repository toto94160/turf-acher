<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mes Pronos</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, system-ui, sans-serif; background:#0f172a; color:#e2e8f0; padding:16px; }
  h1 { color:#38bdf8; text-align:center; font-size:1.4rem; margin-bottom:4px; }
  .sub { text-align:center; font-size:.8rem; color:#94a3b8; margin-bottom:16px; }
  .controls { display:flex; flex-direction:column; gap:8px; margin-bottom:16px; }
  select, button { width:100%; padding:14px; border-radius:10px; border:1px solid #334155; background:#1e293b; color:#e2e8f0; font-size:1rem; }
  button { background:#0284c7; border-color:#0284c7; font-weight:600; }
  button:disabled { opacity:.5; }
  button.refresh { background:#0ea5e9; }
  #status { text-align:center; margin:12px 0; color:#94a3b8; font-size:.9rem; }
  .info { background:#1e293b; padding:14px; border-radius:10px; border-left:4px solid #38bdf8; margin-bottom:12px; }
  .info h2 { color:#38bdf8; font-size:1.05rem; margin-bottom:4px; }
  .info p { font-size:.85rem; color:#cbd5e1; }
  .card { background:#1e293b; padding:12px; border-radius:10px; margin-bottom:8px; display:flex; align-items:center; gap:10px; border-left:3px solid #475569; }
  .card.top1 { border-left-color:#facc15; }
  .card.top2 { border-left-color:#cbd5e1; }
  .card.top3 { border-left-color:#d97706; }
  .rank { font-size:1.2rem; font-weight:700; color:#38bdf8; min-width:28px; text-align:center; }
  .info-h { flex:1; min-width:0; }
  .name { font-weight:600; font-size:.95rem; }
  .meta { font-size:.78rem; color:#94a3b8; margin-top:2px; }
  .cote { font-weight:700; color:#22c55e; font-size:1.05rem; }
  .error { color:#f87171; text-align:center; padding:20px; font-size:.9rem; }
  .footer { text-align:center; margin-top:20px; font-size:.72rem; color:#64748b; line-height:1.5; }
</style>
</head>
<body>

<h1>🐎 Mes Pronos</h1>
<p class="sub">Sélectionnez réunion + course</p>

<div class="controls">
  <select id="reunion"><option value="">— Réunion —</option></select>
  <select id="course" disabled><option value="">— Course —</option></select>
  <button id="load" disabled>Charger les pronostics</button>
  <button id="refresh" class="refresh" disabled style="display:none">🔄 Rafraîchir</button>
</div>

<div id="status">Chargement du programme…</div>
<div id="result"></div>

<div class="footer">
  Données API PMU. Pronostics basés sur les cotes.<br>
  Jouer comporte des risques. 09 74 75 13 13.
</div>

<script>
const PROXY = "https://corsproxy.io/?";
const API = "https://offline.turfinfo.api.pmu.fr/rest/client/1/programme";
const today = new Date().toISOString().slice(0,10).replace(/-/g,"");
let programme = null;
const $ = id => document.getElementById(id);

async function apiGet(path) {
  const res = await fetch(PROXY + encodeURIComponent(`${API}/${path}`));
  if (!res.ok) throw new Error("HTTP " + res.status);
  return res.json();
}

async function init() {
  try {
    programme = await apiGet(today);
    (programme.reunions || []).forEach(ru => {
      const o = document.createElement("option");
      o.value = ru.numOfficiel;
      o.textContent = `R${ru.numOfficiel} — ${ru.hippodrome?.libelleLong || ""}`;
      $("reunion").appendChild(o);
    });
    $("status").textContent = "Sélectionnez une réunion.";
  } catch(e) {
    $("status").innerHTML = `<span class="error">Erreur : ${e.message}</span>`;
  }
}

$("reunion").onchange = () => {
  const ru = programme.reunions.find(x => String(x.numOfficiel) === $("reunion").value);
  $("course").innerHTML = '<option value="">— Course —</option>';
  $("course").disabled = !ru;
  $("load").disabled = true;
  $("refresh").style.display = "none";
  $("result").innerHTML = "";
  if (!ru) return;
  (ru.courses || []).forEach(c => {
    const o = document.createElement("option");
    o.value = c.numOrdre;
    o.textContent = `C${c.numOrdre} — ${c.libelle || ""}`;
    $("course").appendChild(o);
  });
  $("status").textContent = "Sélectionnez une course.";
};

$("course").onchange = () => {
  const ok = !!$("course").value;
  $("load").disabled = !ok;
  if (ok) $("refresh").style.display = "block";
};

$("load").onclick = load;
$("refresh").onclick = load;

async function load() {
  const ru = $("reunion").value, co = $("course").value;
  $("status").textContent = "Chargement…";
  $("result").innerHTML = "";
  try {
    const data = await apiGet(`${today}/R${ru}/C${co}/participants`);
    const parts = (data.participants || []).map(p => ({
      ...p,
      cote: parseFloat(p.dernierRapportDirect?.rapport) || parseFloat(p.dernierRapportReference?.rapport) || 999
    })).sort((a,b) => a.cote - b.cote);

    const ruData = programme.reunions.find(x => String(x.numOfficiel) === ru);
    const coData = ruData.courses.find(c => String(c.numOrdre) === co);

    const info = document.createElement("div");
    info.className = "info";
    info.innerHTML = `<h2>R${ru} C${co} — ${coData.libelle || ""}</h2>
      <p>${coData.discipline || ""} • ${coData.distance || "?"}m • ${parts.length} partants</p>`;
    $("result").appendChild(info);

    parts.forEach((p, i) => {
      const card = document.createElement("div");
      card.className = "card" + (i===0?" top1":i===1?" top2":i===2?" top3":"");
      card.innerHTML = `
        <div class="rank">${i+1}</div>
        <div class="info-h">
          <div class="name">${p.numPmu || ""} — ${p.nom || ""}</div>
          <div class="meta">${p.driver || p.entraineur || ""}</div>
        </div>
        <div class="cote">${p.cote < 999 ? p.cote.toFixed(1) : "—"}</div>`;
      $("result").appendChild(card);
    });
    $("status").textContent = `✅ Mis à jour à ${new Date().toLocaleTimeString()}`;
  } catch(e) {
    $("status").innerHTML = `<span class="error">Erreur : ${e.message}</span>`;
  }
}

init();
</script>
</body>
</html>
